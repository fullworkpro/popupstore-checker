# PopStore Platform — 绿联云 NAS / 通用 Docker Compose 部署
# 用法：
#   1) 在 popstore-platform 目录下执行： docker compose up -d --build
#   2) 管理后台访问 http://<NAS_IP>:8080
#   3) 后端 API 访问 http://<NAS_IP>:8000  （小程序正式环境需套 HTTPS 反代）
#
# 数据持久化：popstore-data 卷同时保存 SQLite 数据库与上传的图片。

services:
  backend:
    build: ./backend
    container_name: popstore-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=sqlite:///./data/popstore.db
      - UPLOAD_DIR=/app/data/uploads
      - SECRET_KEY=change-me-please-use-a-strong-random-string
    volumes:
      - popstore-data:/app/data

  frontend:
    build: ./admin-frontend
    container_name: popstore-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  popstore-data:
